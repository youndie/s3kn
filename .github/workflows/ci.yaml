name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The closing run of a milestone: on Linux the linuxX64Test task is enabled and the tests really
  # do run. They cannot run on macOS, which is why the local loop uses macosArm64.
  linux:
    name: linuxX64 + jvm + ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: build
        run: ./gradlew build --stacktrace

      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/**'

  # The development host target: if it breaks, everyone's local TDD loop stops.
  macos:
    name: macosArm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: build
        run: ./gradlew build --stacktrace

      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: '**/build/reports/tests/**'
