name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The closing run of a milestone: on Linux the linuxX64Test task is enabled and the tests really
  # do run. They cannot run on macOS, which is why the local loop uses macosArm64.
  linux:
    name: linuxX64 + jvm + ktlint + MinIO
    runs-on: ubuntu-latest

    env:
      S3_E2E_ENDPOINT: http://127.0.0.1:9000
      # Without this a missing server would skip the tests that need one, and a skipped test reads
      # exactly like a passing one.
      S3_E2E_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v5

      # Java and Gradle in one step, at the version the whole portfolio uses. The action installs
      # both 21 and 25: Gradle runs on the newer one, and having the other present keeps a toolchain
      # request from turning into a download nobody asked for.
      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      # docker-compose is the single source of truth for the test server. A service container would
      # duplicate it here and drift from what a developer runs locally.
      # Two steps: `up --wait` counts a service that exited as a failure, even on exit zero, so a
      # one-shot bucket creator would fail the job while doing its job.
      - name: start MinIO
        run: |
          docker compose up -d --wait minio
          docker compose run --rm create-buckets

      - name: build
        run: ./gradlew build --stacktrace

      - name: server logs
        if: failure()
        run: docker compose logs --tail 50

      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/**'

  # Every Apple target: macOS and, on a simulator, iOS. No MinIO — GitHub's macOS runners have no
  # Docker, so the live tests skip themselves here, deliberately and with S3_E2E_REQUIRED unset.
  # The live run on Apple is done by hand against a real server and recorded in the backlog.
  macos:
    name: macOS + iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: build
        run: ./gradlew build --stacktrace

      - name: test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-macos
          path: '**/build/reports/tests/**'

  # Builds the image `s3kn` ships in and drives it the way a backup job would. On every pull
  # request, because this is where the failures the library's own suite cannot see live: a shared
  # library the base image does not carry, root certificates that are not there, an entry point that
  # is not an entry point. A built image is not a working one.
  image:
    name: the image, against MinIO
    runs-on: ubuntu-latest

    env:
      # Real AWS over HTTPS from inside the image — only on main, for the same reason the `tls` job
      # below is. On a pull request the MinIO half still runs, and that is what catches a missing
      # library.
      S3KN_IMAGE_TLS_CHECK: ${{ github.event_name == 'push' && '1' || '0' }}

    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: start MinIO
        run: |
          docker compose up -d --wait minio
          docker compose run --rm create-buckets

      - name: build the image and use it
        run: ./s3-cli/verify-image.sh

      - name: server logs
        if: failure()
        run: docker compose logs --tail 50

  # Reaches real AWS over HTTPS from inside a container, and checks that the same image without
  # ca-certificates cannot. Only on main: it depends on a service nobody here controls, and a pull
  # request should not go red because AWS had a bad minute.
  tls:
    name: HTTPS from a container
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: with and without ca-certificates
        run: ./examples/tls-check/verify.sh
