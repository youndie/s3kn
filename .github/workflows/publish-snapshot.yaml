name: Publish snapshot

# Manual on purpose. A snapshot that appears because someone pushed is a snapshot nobody knows the
# provenance of.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Reposilite
    runs-on: ubuntu-latest

    env:
      S3_E2E_ENDPOINT: http://127.0.0.1:9000
      S3_E2E_REQUIRED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: youndie/sborka/.github/actions/setup-kotlin@main

      - name: start MinIO
        run: |
          docker compose up -d --wait minio
          docker compose run --rm create-buckets

      # Nothing gets published that has not passed everything, including the live tests. A snapshot
      # is still something somebody will depend on.
      - name: build and test
        run: ./gradlew build --stacktrace

      # One job, not two: this library has no cinterop, so a Linux runner cross-compiles every klib
      # it publishes, macosArm64 included. That falls straight out of the research — the TLS stack
      # arrives inside the engine's klib instead of being bound to system headers.
      #
      # The repository is named `wip` by the shared convention; it was `WipSnapshots` here. Same
      # server, same credentials — and they now arrive as ORG_GRADLE_PROJECT_ properties rather than
      # bare environment variables, because that is how the convention reads them.
      - name: publish
        env:
          ORG_GRADLE_PROJECT_REPOSILITE_USER: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_REPOSILITE_SECRET: ${{ secrets.REPOSILITE_SECRET }}
        run: ./gradlew publishAllPublicationsToWipRepository --stacktrace
