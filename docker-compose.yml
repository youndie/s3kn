# The S3 server the protocol tests run against.
#
# Pinned to an exact release, not `latest`: MinIO's `latest` tag stopped moving on 2025-09-07, so
# following it would neither give updates nor stay honest about what is being tested. Change the
# tag deliberately, in its own commit, and re-run the whole suite.
#
#   docker compose up -d --wait
#   S3_E2E_ENDPOINT=http://127.0.0.1:9000 ./gradlew :s3-client:linuxX64Test
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: s3kn-test-access-key
      MINIO_ROOT_PASSWORD: s3kn-test-secret-key
      # MinIO is reached as 127.0.0.1, which is not a name any bucket can be a label of, so the
      # tests address it path-style. Nothing here has to change for that; it is a client setting.
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Creates the buckets the tests expect. The library has no CreateBucket — it is out of the v1
  # scope — so something else has to make them.
  create-buckets:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 s3kn-test-access-key s3kn-test-secret-key &&
      mc mb --ignore-existing local/s3kn-test &&
      mc mb --ignore-existing local/s3kn-test-other
      "
