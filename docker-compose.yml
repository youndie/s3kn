# The S3 server the protocol tests run against: SeaweedFS's S3 gateway, one container.
#
# NOT MinIO ANY MORE (M-130). The MinIO this file pinned was pulled from `quay.io/minio` after Docker Hub
# stopped serving it, and on 2026-09-30 both `quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z` and
# `quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z` answered `no such manifest` — on quay.io, on Docker Hub
# and on mirror.gcr.io alike. A test server nobody can pull is no test server. SeaweedFS was measured
# against the whole live suite before it was chosen: everything passed but the one test that pins a
# MinIO-specific answer (a body without a stated length), which now pins SeaweedFS's instead.
#
# Pinned to a tag AND its digest: the tag says what it is, the digest makes sure it stays that. Change it
# deliberately, in its own commit, and re-run the whole suite.
#
#   docker compose up -d --wait s3
#   docker compose run --rm create-buckets
#   S3_E2E_ENDPOINT=http://127.0.0.1:9000 ./gradlew :s3-client:linuxX64Test
#
# Two steps, not `up --wait` on its own: `--wait` treats a service that has exited as a failure, even
# when it exited zero, so a one-shot bucket creator makes the command return 1 while doing exactly what
# it should. Waiting on `s3` alone and running the creator to completion says what is meant and reports
# it honestly.
services:
  s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    # A master, a volume server, a filer and the S3 gateway in one process: the smallest SeaweedFS there is.
    # The gateway listens on 9000, the port MinIO had, so nothing that reaches the server has to change.
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/s3kn/s3.json
    configs:
      - source: identities
        target: /etc/s3kn/s3.json
    # Reached as 127.0.0.1, which is not a name any bucket can be a label of, so the tests address it
    # path-style. Nothing here has to change for that; it is a client setting.
    ports:
      - "9000:9000"
    healthcheck:
      # Answered without credentials, unlike `/`, which a signed request is expected at.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Creates the buckets the tests expect. The library has no CreateBucket — it is out of the v1
  # scope — so something else has to make them: SeaweedFS's own shell, from the same image, so there is
  # one image to pull and not two. Started with `run`, not `up`: it is meant to exit.
  create-buckets:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.create -name s3kn-test' | weed shell -master=s3:9333 &&
      echo 's3.bucket.create -name s3kn-test-other' | weed shell -master=s3:9333
      "

# The one identity the tests sign as — the same keys the tests default to (s3-testing's E2E).
configs:
  identities:
    content: |
      {"identities": [{"name": "s3kn", "credentials": [{"accessKey": "s3kn-test-access-key", "secretKey": "s3kn-test-secret-key"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
