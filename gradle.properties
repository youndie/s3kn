org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official

# linuxX64 tests cannot run on macOS, and KGP disables the `linuxX64Test` task on a non-Linux host
# by itself — there is no point in being warned about it on every configuration. The closing run of
# a milestone happens on Linux, where the task is enabled.
kotlin.native.ignoreDisabledTargets=true
