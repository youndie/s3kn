org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official

# A default that is a snapshot on purpose: a build with no -PVERSION must not be able to produce
# something that looks like a release.
version=0.1.0-SNAPSHOT

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
sborka.group=io.github.youndie
sborka.repository=youndie/s3kn
sborka.description=S3 client for Kotlin/Native: SigV4 signing, presigned URLs and the object operations, built to run where the AWS SDK does not.
sborka.inceptionYear=2026

# TWO DIFFERENT NUMBERS, AND THE DIFFERENCE IS THE POINT. The toolchain is the JDK this library is
# BUILT with; the floor is the oldest Java a consumer may be ON. Deliberately far apart: the JDK that
# builds a library is not the JDK that has to run it. `sborka.kmp` compiles the jvm target to the
# floor and `sborka.publish` advertises it, so the bytecode and the metadata come from this one line.
sborka.jvmToolchain=25
sborka.jvmFloor=17

# linuxX64 tests cannot run on macOS, and KGP disables the `linuxX64Test` task on a non-Linux host
# by itself — there is no point in being warned about it on every configuration. The closing run of
# a milestone happens on Linux, where the task is enabled.
kotlin.native.ignoreDisabledTargets=true
